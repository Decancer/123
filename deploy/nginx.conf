# Blog — Nginx 反向代理配置
# 放至: /etc/nginx/sites-available/blog
# 启用: sudo ln -sf /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/

server {
    listen 80;
    # 有域名时替换: server_name blog.example.com;
    # 仅 IP 访问时用 _ 匹配所有:
    server_name _;

    client_max_body_size 10M;

    access_log /var/www/blog/logs/nginx-access.log;
    error_log  /var/www/blog/logs/nginx-error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /_next/static {
        alias /var/www/blog/app/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
