# Blog — Nginx 反向代理配置
# 放至: /etc/nginx/sites-available/mashiro
# 启用: sudo ln -sf /etc/nginx/sites-available/mashiro /etc/nginx/sites-enabled/
# 测试: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name mashiro.chat www.mashiro.chat;

    client_max_body_size 10M;

    # 日志
    access_log /var/www/blog/logs/nginx-access.log;
    error_log  /var/www/blog/logs/nginx-error.log;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
