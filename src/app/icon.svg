<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角方块 -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- 猫头轮廓 -->
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <!-- 左耳 -->
    <path d="M 18 35 L 28 10 L 38 35" />
    <!-- 右耳 -->
    <path d="M 62 35 L 72 10 L 82 35" />
  </g>
  <!-- 内耳 -->
  <path d="M 23 35 L 29 18 L 35 35" fill="#f472b6" stroke="none"/>
  <path d="M 65 35 L 71 18 L 77 35" fill="#f472b6" stroke="none"/>
  <!-- 圆脸 -->
  <circle cx="50" cy="55" r="28" fill="#fff"/>
  <!-- 眼睛 -->
  <circle cx="38" cy="52" r="5" fill="#1e1b4b"/>
  <circle cx="62" cy="52" r="5" fill="#1e1b4b"/>
  <!-- 高光 -->
  <circle cx="36" cy="50" r="2" fill="#fff"/>
  <circle cx="60" cy="50" r="2" fill="#fff"/>
  <!-- 小鼻子 -->
  <ellipse cx="50" cy="62" rx="3" ry="2" fill="#f472b6"/>
  <!-- 嘴 -->
  <path d="M 44 66 Q 50 72 56 66" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>
