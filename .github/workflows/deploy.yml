name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: /var/www/blog
          EXCLUDE: |
            .git
            .gitignore
            node_modules
            .env
            .next
            dev.db
          SCRIPT_AFTER: |
            cd /var/www/blog
            sudo npm install --omit=dev
            sudo npm install --save-dev prisma @types/node typescript tsx
            sudo npx prisma generate
            sudo npm run build
            sudo npx prisma db push
            sudo mkdir -p .next/standalone/public
            sudo cp -r public/* .next/standalone/public/
            sudo cp -r .next/static .next/standalone/.next/
            sudo pm2 reload mashiro-blog
